## Local development stack with MinIO (S3-compatible) for cache testing.
##
## Usage:
##   docker compose -f docker-compose.dev.yml up -d    # start MinIO
##   go run . --verbose                                 # start the app (reads .env automatically via the shell env below)
##
## Or run everything in Docker:
##   docker compose -f docker-compose.dev.yml --profile app up --build
##
## MinIO console: http://localhost:9001 (minioadmin / minioadmin)
## Prometheus metrics: http://localhost:8080/api/metrics

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Create the cache bucket on first startup
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/oci-cache &&
      echo 'Bucket oci-cache ready'
      "

  # Optional: run the full app in Docker (use --profile app)
  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      CACHE_S3_BUCKET: oci-cache
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      minio-setup:
        condition: service_completed_successfully

volumes:
  minio-data:
