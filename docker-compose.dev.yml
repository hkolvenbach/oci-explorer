## Local development stack: app + MinIO (S3-compatible cache) + Trivy.
##
## Quick start:
##   docker compose -f docker-compose.dev.yml up --build
##
## Services:
##   app          http://localhost:8080       OCI Explorer (built from Dockerfile)
##   minio        http://localhost:9000       S3-compatible API
##   minio-admin  http://localhost:9001       MinIO web console (minioadmin / minioadmin)
##
## Endpoints:
##   /api/health     Health check (cacheEnabled: true)
##   /api/metrics    Prometheus metrics (oci_cache_requests_total, etc.)
##   /api/inspect    Image inspection (cached)
##   /api/scan       Vulnerability scan (cached, ?force=1 to bypass)
##
## Delve debugger:
##   Port 2345 is exposed for remote attach debugging.
##   To use it, build with debug symbols and start via Delve instead of the
##   default entrypoint (see DEVELOPER.md for step-by-step instructions).
##
## Tear down:
##   docker compose -f docker-compose.dev.yml down            # stop, keep data
##   docker compose -f docker-compose.dev.yml down -v         # stop + delete MinIO data

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev-docker-compose
        TRIVY_VERSION: "0.69.3"
    ports:
      - "8080:8080"   # HTTP server
      - "2345:2345"   # Delve debugger (remote attach)
    environment:
      CACHE_S3_BUCKET: oci-cache
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"   # skip IMDS probes inside Docker
      # Docker Hub auth (optional) — set in .env or shell to avoid rate limits.
      # Trivy uses TRIVY_USERNAME/TRIVY_PASSWORD for its own registry pulls.
      DOCKER_HUB_USER: ${DOCKER_HUB_USER:-}
      DOCKER_HUB_TOKEN: ${DOCKER_HUB_TOKEN:-}
      TRIVY_USERNAME: ${DOCKER_HUB_USER:-}
      TRIVY_PASSWORD: ${DOCKER_HUB_TOKEN:-}
    volumes:
      - trivy-cache:/tmp                   # Trivy DBs are ~700MB+ uncompressed; volume avoids tmpfs size limits
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot init container: creates the cache bucket if it doesn't exist
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/oci-cache &&
      echo 'Bucket oci-cache ready'
      "

volumes:
  minio-data:
  trivy-cache:
