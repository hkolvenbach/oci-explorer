# fly.toml app configuration file generated for oci-explorer on 2026-02-13T14:21:43+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oci-explorer'
primary_region = 'fra'

[build]
  image = 'ghcr.io/hkolvenbach/oci-explorer:latest'
  # To build from source instead: dockerfile = 'Dockerfile'

[env]
  LOG_FORMAT = 'json'
  CACHE_S3_BUCKET = 'oci-explorer-cache'
  METRICS_PORT = '9090'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[metrics]
  port = 9090
  path = "/metrics"

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
