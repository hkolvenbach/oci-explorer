name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — build and verify everything but skip tag push, release upload, image push, and signing'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-frontend

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"

      - name: Verify dependencies
        run: go mod download && go mod verify

      - uses: ./.github/actions/setup-trivy

      - name: Run tests
        run: go test -v ./...

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine semantic version
        id: semver
        uses: paulhatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "MAJOR"
          minor_pattern: "MINOR"
          bump_each_commit: true
          search_commit_body: true
          version_format: "${major}.${minor}.${patch}"

  release-binaries:
    runs-on: ubuntu-latest
    needs: [test, version]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-frontend

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"

      - name: Verify dependencies
        run: go mod download && go mod verify

      - name: Create and push tag
        if: inputs.dry-run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a v${{ needs.version.outputs.version }} -m "Release v${{ needs.version.outputs.version }}"
          git push origin v${{ needs.version.outputs.version }}

      - name: Build all platforms
        run: make build-all VERSION=${{ needs.version.outputs.version }}

      - name: Create release archives
        run: make release VERSION=${{ needs.version.outputs.version }}

      - name: Attest build provenance for release artifacts
        if: inputs.dry-run != true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: build/release/*.tar.gz

      - name: Upload GitHub Release
        if: inputs.dry-run != true
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            build/release/*.tar.gz
            build/release/checksums.txt
          generate_release_notes: true

  release-docker:
    runs-on: ubuntu-latest
    needs: [test, version, release-binaries]
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        if: inputs.dry-run != true
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry-run != true }}
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      # cosign defaults to the new Sigstore Bundle v0.3 format with cosign v3+
      # (sigstore/cosign-installer v4+). That format is stored only via the
      # OCI 1.1 referrers API, which GHCR does not currently fulfil cleanly,
      # leaving signatures invisible to consumers that look for legacy
      # `.sig`/`.att` tags. Pin to legacy format until both publisher and
      # consumer ecosystems fully support OCI 1.1 referrers on GHCR.
      - name: Sign image with cosign (keyless)
        if: inputs.dry-run != true
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "${IMAGE}@${{ steps.docker-push.outputs.digest }}"

      - name: Attest build provenance for Docker image
        if: inputs.dry-run != true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.docker-push.outputs.digest }}
          push-to-registry: true

      - uses: ./.github/actions/setup-trivy

      # Bundled-binary scan and VEX attestation require the image to be in
      # the registry, so skip the whole VEX block in dry-run mode.
      - name: Resolve first platform digest
        id: platform
        if: inputs.dry-run != true
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect --raw "${IMAGE}@${{ steps.docker-push.outputs.digest }}" \
            | jq -r '[.manifests[] | select(.platform.architecture != "unknown") | .digest] | .[0]')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Using bundled-binary scan target: ${IMAGE}@${DIGEST}"

      - name: Generate OpenVEX document
        if: inputs.dry-run != true
        uses: ./.github/actions/generate-vex
        with:
          product: "pkg:oci/${{ github.event.repository.name }}@${{ steps.docker-push.outputs.digest }}?repository_url=${{ env.IMAGE }}"
          author: ${{ github.repository_owner }}
          bundled-image: "${{ env.IMAGE }}@${{ steps.platform.outputs.digest }}"

      - name: Attach VEX as cosign attestation
        if: inputs.dry-run != true
        run: |
          cosign attest --yes --verbose --new-bundle-format=false --use-signing-config=false \
            --type openvex \
            --predicate vex.json \
            "${IMAGE}@${{ steps.docker-push.outputs.digest }}"

      - name: Upload VEX document as build artifact
        if: inputs.dry-run != true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vex-document
          path: vex.json
          retention-days: 90

      - name: Verify signatures and attestations (smoke test)
        if: inputs.dry-run != true
        env:
          INDEX_DIGEST: ${{ steps.docker-push.outputs.digest }}
        run: |
          set -euo pipefail
          CERT_IDENTITY="https://github.com/${{ github.repository }}"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          echo "=== 1. Cosign: verify image signature on the index ==="
          cosign verify --new-bundle-format=false \
            --certificate-identity-regexp="$CERT_IDENTITY" \
            --certificate-oidc-issuer="$OIDC_ISSUER" \
            "${IMAGE}@${INDEX_DIGEST}"

          echo "=== 2. Cosign: verify VEX attestation on the index ==="
          cosign verify-attestation --new-bundle-format=false \
            --type openvex \
            --certificate-identity-regexp="$CERT_IDENTITY" \
            --certificate-oidc-issuer="$OIDC_ISSUER" \
            "${IMAGE}@${INDEX_DIGEST}"

          echo "=== 3. Assert legacy .sig and .att tags exist ==="
          # Consumers (incl. ociexplorer.dev) discover signatures and
          # attestations via the legacy `sha256-<digest>.sig` / `.att`
          # tag scheme. Catch any cosign default change that flips back
          # to the new bundle format here, before it ships.
          DIGEST_HEX="${INDEX_DIGEST#sha256:}"
          for SUFFIX in sig att; do
            TAG="sha256-${DIGEST_HEX}.${SUFFIX}"
            if ! docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
              echo "::error::Legacy cosign tag ${IMAGE}:${TAG} missing — VEX/signature will not be discoverable"
              exit 1
            fi
            echo "OK: ${IMAGE}:${TAG} present"
          done

          echo "=== 4. Cosign: extract and validate VEX document ==="
          cosign verify-attestation --new-bundle-format=false \
            --type openvex \
            --certificate-identity-regexp="$CERT_IDENTITY" \
            --certificate-oidc-issuer="$OIDC_ISSUER" \
            "${IMAGE}@${INDEX_DIGEST}" \
            | head -1 | jq -r '.payload' | base64 -d | jq '.predicate' > extracted-vex.json
          echo "Extracted VEX document:"
          jq '.' extracted-vex.json

          echo "=== 5. Validate VEX document structure ==="
          jq -e '.["@context"] and .statements' extracted-vex.json > /dev/null
          echo "VEX document has valid OpenVEX structure (context + statements present)"

          echo "=== 6. Validate VEX has specific CVE statements (not just NOASSERTION) ==="
          STMT_COUNT=$(jq '.statements | length' extracted-vex.json)
          NOASSERTION_COUNT=$(jq '[.statements[] | select(.vulnerability.name == "NOASSERTION")] | length' extracted-vex.json)
          echo "Total statements: $STMT_COUNT, NOASSERTION: $NOASSERTION_COUNT"
          if [ "$STMT_COUNT" -eq 0 ]; then
            echo "::error::VEX document has no statements"
            exit 1
          fi
          if [ "$STMT_COUNT" -eq "$NOASSERTION_COUNT" ]; then
            echo "::error::VEX document only contains NOASSERTION statements — CVE-specific statements are missing"
            exit 1
          fi
          echo "VEX document has $STMT_COUNT specific CVE statements"

          echo "=== 7. Trivy: scan with VEX from OCI attestation ==="
          trivy image --vex oci --format table --scanners vuln "${IMAGE}@${INDEX_DIGEST}"
          echo "Trivy VEX integration check complete"

  deploy-fly:
    runs-on: ubuntu-latest
    needs: [version, release-docker]
    if: inputs.dry-run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy to Fly.io
        run: flyctl deploy --image ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
