name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — build and verify everything but skip tag push, release upload, image push, and signing'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.14"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.1"

      - name: Verify dependencies
        run: go mod download && go mod verify

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.69.3/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3

      - name: Run tests
        run: go test -v ./...

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine semantic version
        id: semver
        uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "MAJOR"
          minor_pattern: "MINOR"
          bump_each_commit: true
          search_commit_body: true
          version_format: "${major}.${minor}.${patch}"

  release-binaries:
    runs-on: ubuntu-latest
    needs: [test, version]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.14"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.1"

      - name: Verify dependencies
        run: go mod download && go mod verify

      - name: Create and push tag
        if: inputs.dry-run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a v${{ needs.version.outputs.version }} -m "Release v${{ needs.version.outputs.version }}"
          git push origin v${{ needs.version.outputs.version }}

      - name: Build all platforms
        run: make build-all VERSION=${{ needs.version.outputs.version }}

      - name: Create release archives
        run: make release VERSION=${{ needs.version.outputs.version }}

      - name: Attest build provenance for release artifacts
        if: inputs.dry-run != true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: build/release/*.tar.gz

      - name: Upload GitHub Release
        if: inputs.dry-run != true
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            build/release/*.tar.gz
            build/release/checksums.txt
          generate_release_notes: true

  release-docker:
    runs-on: ubuntu-latest
    needs: [test, version, release-binaries]
    outputs:
      digest: ${{ steps.docker-push.outputs.digest }}
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.1"

      - name: Install cosign
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        if: inputs.dry-run != true
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker-push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry-run != true }}
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Sign image with cosign (keyless)
        if: inputs.dry-run != true
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.docker-push.outputs.digest }}

      - name: Attest build provenance for Docker image
        if: inputs.dry-run != true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker-push.outputs.digest }}
          push-to-registry: true

      - name: Generate and attach OpenVEX documents (per-platform)
        if: inputs.dry-run != true
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          REPO_NAME="${{ github.event.repository.name }}"
          AUTHOR="${{ github.repository_owner }}"

          # Install tools (in case they aren't already available from the action)
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/openvex/vexctl@v0.4.1

          # Run govulncheck once — source-level analysis applies to all platforms
          govulncheck -format json ./... > govulncheck-output.json || true

          # Extract vulnerability IDs
          CALLED_OSVS=$(jq -r 'select(.finding) | select(.finding.trace[0].function) | .finding.osv' govulncheck-output.json | sort -u || true)
          ALL_FINDING_OSVS=$(jq -r 'select(.finding) | .finding.osv' govulncheck-output.json | sort -u || true)
          NOT_CALLED_OSVS=$(comm -23 <(echo "$ALL_FINDING_OSVS") <(echo "$CALLED_OSVS") || true)

          resolve_aliases() {
            local osv_ids="$1"
            local cves=""
            for osv in $osv_ids; do
              aliases=$(jq -r "select(.osv) | select(.osv.id == \"$osv\") | .osv.aliases[]" govulncheck-output.json 2>/dev/null | sort -u || true)
              cves="$cves $aliases"
            done
            echo "$cves" | tr ' ' '\n' | grep -E '^CVE-|^GHSA-' | sort -u || true
          }

          CALLED_CVES=$(resolve_aliases "$CALLED_OSVS")
          NOT_CALLED_CVES=$(resolve_aliases "$NOT_CALLED_OSVS")

          # Shell function to generate a VEX document for a given product PURL
          generate_vex() {
            local product="$1"
            rm -f vex.json
            local first=true

            for CVE in $CALLED_CVES; do
              if [ "$first" = true ]; then
                vexctl create --author="$AUTHOR" --file=vex.json -p "$product" \
                  -v "$CVE" -s under_investigation \
                  --status-note "govulncheck reports this vulnerability as reachable in the call graph"
                first=false
              else
                vexctl add --in-place -p "$product" -v "$CVE" -s under_investigation \
                  --status-note "govulncheck reports this vulnerability as reachable in the call graph" \
                  vex.json || true
              fi
            done

            for CVE in $NOT_CALLED_CVES; do
              if [ "$first" = true ]; then
                vexctl create --author="$AUTHOR" --file=vex.json -p "$product" \
                  -v "$CVE" -s not_affected -j vulnerable_code_not_in_execute_path \
                  --impact-statement "Package is imported but the vulnerable function is not called"
                first=false
              else
                vexctl add --in-place -p "$product" -v "$CVE" -s not_affected \
                  -j vulnerable_code_not_in_execute_path \
                  --impact-statement "Package is imported but the vulnerable function is not called" \
                  vex.json || true
              fi
            done

            if [ "$first" = true ]; then
              vexctl create --author="$AUTHOR" --file=vex.json -p "$product" \
                -v "NOASSERTION" -s not_affected -j vulnerable_code_not_in_execute_path \
                --impact-statement "govulncheck found no reachable or imported vulnerabilities"
            fi
          }

          # Extract platform manifest digests (skip unknown/unknown attestation manifests)
          PLATFORM_DIGESTS=$(docker buildx imagetools inspect --raw "$IMAGE@${{ steps.docker-push.outputs.digest }}" \
            | jq -r '.manifests[] | select(.platform.architecture != "unknown") | .digest')

          echo "Platform digests:"
          echo "$PLATFORM_DIGESTS"

          # Attach VEX to each platform manifest
          for DIGEST in $PLATFORM_DIGESTS; do
            echo "--- Attaching VEX to $DIGEST ---"
            PRODUCT="pkg:oci/${REPO_NAME}@${DIGEST}?repository_url=${IMAGE}"
            generate_vex "$PRODUCT"
            echo "Generated vex.json for $DIGEST:"
            cat vex.json

            cosign attest --yes --verbose \
              --type openvex \
              --predicate vex.json \
              "${IMAGE}@${DIGEST}"
          done

      - name: Upload VEX document as build artifact
        if: inputs.dry-run != true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vex-document
          path: vex.json
          retention-days: 90

  smoke-test:
    runs-on: ubuntu-latest
    needs: [version, release-binaries, release-docker]
    if: inputs.dry-run != true
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.69.2/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.2

      - name: Login to GHCR (read-only)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Container startup test ──────────────────────────────────────
      - name: "Smoke test: container startup"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}"
          echo "Pulling and starting $IMAGE..."
          docker run -d --name smoke-test -p 8080:8080 -e PORT=8080 "$IMAGE"

          echo "Waiting for /api/health (up to 30s)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "FAIL: container did not become healthy within 30s"
              docker logs smoke-test
              exit 1
            fi
            sleep 1
          done

          HEALTH=$(curl -sf http://localhost:8080/api/health)
          echo "Health response: $HEALTH"

          # Verify version field matches
          GOT_VERSION=$(echo "$HEALTH" | jq -r '.version')
          WANT_VERSION="${{ needs.version.outputs.version }}"
          if [ "$GOT_VERSION" != "$WANT_VERSION" ]; then
            echo "FAIL: version mismatch (got=$GOT_VERSION, want=$WANT_VERSION)"
            exit 1
          fi
          echo "PASS: version matches ($GOT_VERSION)"

          # Verify trivyAvailable field exists
          TRIVY=$(echo "$HEALTH" | jq -r '.trivyAvailable')
          if [ "$TRIVY" != "true" ] && [ "$TRIVY" != "false" ]; then
            echo "FAIL: trivyAvailable field missing or invalid (got=$TRIVY)"
            exit 1
          fi
          echo "PASS: trivyAvailable=$TRIVY"

          docker stop smoke-test && docker rm smoke-test
          echo "Container smoke test passed."

      # ── 2. Binary execution test ───────────────────────────────────────
      - name: "Smoke test: binary execution"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ASSET="oci-explorer-${VERSION}-linux-amd64.tar.gz"

          echo "Downloading $ASSET from release v${VERSION}..."
          gh release download "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --dir /tmp/smoke-binary

          echo "Extracting binary..."
          tar -xzf "/tmp/smoke-binary/$ASSET" -C /tmp/smoke-binary
          chmod +x /tmp/smoke-binary/oci-explorer-linux-amd64

          echo "Starting binary on port 8081..."
          PORT=8081 /tmp/smoke-binary/oci-explorer-linux-amd64 &
          BINARY_PID=$!

          echo "Waiting for /api/health (up to 15s)..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8081/api/health > /dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "FAIL: binary did not become healthy within 15s"
              kill $BINARY_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          HEALTH=$(curl -sf http://localhost:8081/api/health)
          echo "Health response: $HEALTH"

          GOT_VERSION=$(echo "$HEALTH" | jq -r '.version')
          if [ "$GOT_VERSION" != "$VERSION" ]; then
            echo "FAIL: version mismatch (got=$GOT_VERSION, want=$VERSION)"
            kill $BINARY_PID 2>/dev/null || true
            exit 1
          fi
          echo "PASS: version matches ($GOT_VERSION)"

          kill $BINARY_PID 2>/dev/null || true
          wait $BINARY_PID 2>/dev/null || true
          echo "Binary smoke test passed."

      # ── 3. Cosign signature verification ───────────────────────────────
      - name: "Smoke test: cosign signature on index"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          DIGEST="${{ needs.release-docker.outputs.digest }}"
          echo "Verifying cosign signature on ${IMAGE}@${DIGEST}..."
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          echo "PASS: cosign signature verified."

      # ── 4. All-platform VEX verification ───────────────────────────────
      - name: "Smoke test: VEX attestations (all platforms)"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          DIGEST="${{ needs.release-docker.outputs.digest }}"

          echo "Extracting platform digests from ${IMAGE}@${DIGEST}..."
          PLATFORM_DIGESTS=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.architecture != "unknown") | "\(.platform.os)/\(.platform.architecture) \(.digest)"')

          echo "Platform digests:"
          echo "$PLATFORM_DIGESTS"

          PLATFORM_COUNT=0
          VERIFIED_COUNT=0

          while IFS=' ' read -r PLATFORM PLAT_DIGEST; do
            PLATFORM_COUNT=$((PLATFORM_COUNT + 1))
            echo ""
            echo "=== Verifying VEX for $PLATFORM ($PLAT_DIGEST) ==="

            cosign verify-attestation \
              --type openvex \
              --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "${IMAGE}@${PLAT_DIGEST}"

            echo "PASS: VEX attestation verified for $PLATFORM"
            VERIFIED_COUNT=$((VERIFIED_COUNT + 1))
          done <<< "$PLATFORM_DIGESTS"

          echo ""
          echo "Verified $VERIFIED_COUNT / $PLATFORM_COUNT platforms."
          if [ "$VERIFIED_COUNT" -ne "$PLATFORM_COUNT" ]; then
            echo "FAIL: not all platforms verified"
            exit 1
          fi
          if [ "$PLATFORM_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 platforms, got $PLATFORM_COUNT"
            exit 1
          fi
          echo "PASS: all $PLATFORM_COUNT platform VEX attestations verified."

      # ── 5. VEX document structure validation ───────────────────────────
      - name: "Smoke test: VEX document structure"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          DIGEST="${{ needs.release-docker.outputs.digest }}"

          # Get the first platform digest for structure validation
          PLAT_DIGEST=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '[.manifests[] | select(.platform.architecture != "unknown")] | .[0].digest')

          echo "Extracting VEX document from ${PLAT_DIGEST}..."
          cosign verify-attestation \
            --type openvex \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${PLAT_DIGEST}" 2>/dev/null \
            | head -1 | jq -r '.payload' | base64 -d | jq '.predicate' > /tmp/extracted-vex.json

          echo "Extracted VEX document:"
          jq '.' /tmp/extracted-vex.json

          jq -e '.["@context"] and (.statements | length > 0)' /tmp/extracted-vex.json > /dev/null
          echo "PASS: VEX document has valid OpenVEX structure"

      # ── 6. Trivy VEX integration check ─────────────────────────────────
      - name: "Smoke test: Trivy VEX integration"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          DIGEST="${{ needs.release-docker.outputs.digest }}"

          PLAT_DIGEST=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '[.manifests[] | select(.platform.architecture != "unknown")] | .[0].digest')

          echo "Running Trivy with VEX on ${IMAGE}@${PLAT_DIGEST}..."
          # Trivy exits non-zero when vulnerabilities are found, which is expected.
          # We only care that Trivy runs successfully with VEX — not that the image is vuln-free.
          trivy image --vex oci --format table "${IMAGE}@${PLAT_DIGEST}"; TRIVY_EXIT=$?
          if [ "$TRIVY_EXIT" -gt 1 ]; then
            echo "FAIL: Trivy exited with unexpected error code $TRIVY_EXIT"
            exit 1
          fi
          echo "PASS: Trivy VEX integration check complete (exit=$TRIVY_EXIT)."

  deploy-fly:
    runs-on: ubuntu-latest
    needs: [version, smoke-test]
    if: inputs.dry-run != true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5

      - name: Deploy to Fly.io
        run: flyctl deploy --image ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
